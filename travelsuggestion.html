<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Tour | Travel Suggestion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

/* SAME BACKGROUND */
body{
    color:white;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* SECTION */
.section{
    padding:80px 10%;
    text-align:center;
}

h2{
    font-size:2.5rem;
    margin-bottom:30px;
}

/* FORM BOX */
.suggestion-box{
    max-width:600px;
    margin:auto;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:20px;
}

/* INPUT */
.suggestion-box select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
}

/* BUTTON */
.suggestion-box button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#38bdf8;
    cursor:pointer;
}

/* RESULT */
.result{
    margin-top:40px;
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:20px;
    display:none;
}

/* NAVBAR CONTAINER */
.navbar{
position: fixed;
top:0;
width:100%;
z-index:1000;

display:flex;
justify-content:space-between;
align-items:center;

padding:15px 8%;

background: rgba(15, 23, 42, 0.7);
backdrop-filter: blur(12px);

border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* LOGO */
.logo{
font-size:1.5rem;
font-weight:700;
letter-spacing:2px;
}

.logo span{
color:#38bdf8;
}

/* NAV MENU */
.nav-menu{
display:flex;
align-items:center;
gap:25px;
}

.nav-menu a{
text-decoration:none;
color:white;
font-size:0.9rem;
position:relative;
transition:0.3s;
}

/* UNDERLINE HOVER */
.nav-menu a::after{
content:"";
position:absolute;
left:0;
bottom:-5px;
width:0%;
height:2px;
background:#38bdf8;
transition:0.3s;
}

.nav-menu a:hover::after{
width:100%;
}

/* DROPDOWN */
.dropdown{
position:relative;
}

.dropdown-content{
position:absolute;
top:35px;
left:0;

background: rgba(15, 23, 42, 0.95);
backdrop-filter: blur(10px);

border-radius:10px;
padding:10px 0;

display:none;
flex-direction:column;
min-width:150px;
}

.dropdown-content a{
padding:10px 15px;
display:block;
}

.dropdown-content a:hover{
background: rgba(255,255,255,0.1);
}

/* SHOW DROPDOWN */
.dropdown:hover .dropdown-content{
display:flex;
}

/* RIGHT SIDE */
.nav-right{
display:flex;
align-items:center;
gap:15px;
}
/* LOGIN */
.nav-right a{
color:white;
text-decoration:none;
font-size:0.9rem;
}
/* SIGNUP BUTTON */
.btn-signup{
padding:8px 18px;
border-radius:20px;
background:#38bdf8;
color:white !important;
transition:0.3s;
}

.btn-signup:hover{
background:#0ea5e9;
transform:scale(1.05);
}
/* BODY FIX FOR FIXED NAVBAR */
body{
padding-top:80px;
}

/* MOBILE */
@media(max-width:768px){

.nav-menu{
display:none;
}

.navbar{
padding:15px 5%;
}

}



</style>
</head>

<body>

<header class="navbar">

<div class="logo">POCKET<span>TOUR</span></div>

<nav class="nav-menu">
<a href="HOME1.html">Home</a>
<a href="destination.html">Destinations</a>
<a href="Package.html">Packages</a>
<a href="Contact.html">Contact</a>
<a href="whyus.html">Why Us?</a>

<div class="dropdown">
<a href="#">Services ▾</a>
<div class="dropdown-content">
<a href="explore.html">Explore</a>
<a href="localtransport.html">Transport</a>
<a href="travelsuggestion.html">Suggestion</a>
</div>
</div>

</nav>

<div class="nav-right">
<a href="login06.html">Log In</a>
<a href="signup.html" class="btn-signup">Sign Up</a>
</div>
<div class="nav-right" id="userArea">
                
    <!-- Dynamic content will come here -->
</div>


</header>


<section class="section">

<h2>Not Sure Where To Go?</h2>

<div class="suggestion-box">

<select id="budget">
<option value="">Select Budget</option>
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select>

<select id="group">
<option value="">Group Type</option>
<option value="Couple">Couple</option>
<option value="solo">Solo Traveler</option>
<option value="friends">Friends Group</option>
<option value="family">Family Trip</option>
<option value="couple">Couple</option>
<option value="students">University / College Students</option>
<option value="office">Office / Corporate Team</option>
<option value="mixed">Mixed Group</option>
</select>

<select id="days">
<option value="">Trip Duration</option>
<option value="short">1-2 Days</option>
<option value="medium">3-5 Days</option>
<option value="long">5+ Days</option>
</select>

<select id="type">
<option value="">Trip Type</option>
<option value="adventure">Adventure</option>
<option value="relax">Relax</option>
<option value="beach">Beach</option>
<option value="nature">Nature</option>
</select>

<select id="safety">
<option value="">Safety Priority</option>
<option value="high">High</option>
<option value="normal">Normal</option>
</select>

<select id="food">
<option value="">Food Preference</option>
<option value="included">Included</option>
<option value="no">Not Needed</option>
</select>

<select id="stay">
<option value="">Stay Type</option>
<option value="budget">Budget</option>
<option value="hotel">Hotel</option>
<option value="resort">Resort</option>
</select>

<select id="location">
<option value="">Preferred Location</option>
<option value="hill">Hill</option>
<option value="sea">Sea</option>
<option value="city">City</option>
</select>

<button onclick="getSuggestion()">Get Suggestion</button>
<button onclick="contactExpert()" style="background:#22c55e; margin-top:10px;">
Contact Travel Expert
</button>

</div>

<!-- RESULT -->
<div class="result" id="resultBox">
<h3 id="place"></h3>
<p id="reason"></p>
<p id="cost"></p>
</div>

</section>

<script>

function getSuggestion(){

let budget = document.getElementById("budget").value;
let type = document.getElementById("type").value;
let group = document.getElementById("group").value;

let place = "";
let reason = "";
let cost = "";

/* LOGIC */

if(budget==="low" && type==="adventure"){
    place="Sajek Valley";
    reason="Best budget adventure trip with friends";
    cost="Approx ৳4000";
}

else if(type==="beach"){
    place="Cox's Bazar";
    reason="Perfect beach relaxation trip";
    cost="Approx ৳7000";
}

else if(type==="nature"){
    place="Sylhet";
    reason="Tea gardens & waterfalls";
    cost="Approx ৳6000";
}

else if(type==="adventure" && budget==="medium"){
    place="Bandarban";
    reason="Hills, trekking & adventure";
    cost="Approx ৳8000";
}

else if(budget==="high"){
    place="Saint Martin";
    reason="Premium island experience";
    cost="Approx ৳12000";
}

else{
    place="Khagrachari";
    reason="Budget friendly peaceful trip";
    cost="Approx ৳5000";
}

/* SHOW RESULT */

document.getElementById("place").innerHTML="Recommended: "+place;
document.getElementById("reason").innerHTML=reason;
document.getElementById("cost").innerHTML=cost;

document.getElementById("resultBox").style.display="block";

}
</script>
<script>

</script>


<script>
const user = JSON.parse(localStorage.getItem("user"));
const userArea = document.getElementById("userArea");

    `;
} else {

       <a href="login06.html" 
   style="background: var(--primary-color); color: #333; padding: 10px 25px; border-radius: 30px; text-decoration: none; font-weight: 700; transition: 0.3s;">
   Log In
</a>
<a href="signup.html" 
   style="background: var(--primary-color); color: #333; padding: 10px 25px; border-radius: 30px; text-decoration: none; font-weight: 700; transition: 0.3s;">
   Sign Up
</a>
    `;
}
function goProfile() {
    window.location.href = "userprofile.html";
}
</script>
<script>
function isLoggedIn() {
    return localStorage.getItem("user") !== null;
}
</script>

</body>
</html>
