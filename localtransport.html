<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    color:white;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    min-height:100vh;
}

.section{
    padding:100px 5%;
    max-width:1400px;
    margin:0 auto;
    text-align:center;
}

h1{
    font-size:3.2rem;
    font-weight:700;
    margin-bottom:15px;
    background:linear-gradient(45deg,#38bdf8,#60a5fa);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}

.subtitle{
    font-size:1.2rem;
    opacity:0.9;
    margin-bottom:50px;
    font-weight:300;
}

/* FILTER BAR */
.filter-container{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:25px;
    margin-bottom:50px;
    border:1px solid rgba(255,255,255,0.2);
}

.filter-box{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
    align-items:center;
}

.filter-group{
    position:relative;
}

select{
    padding:15px 20px 15px 45px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    color:white;
    font-size:1rem;
    min-width:160px;
    cursor:pointer;
    transition:0.3s;
}

select:focus{
    outline:none;
    border-color:#38bdf8;
    box-shadow:0 0 20px rgba(56,189,248,0.3);
}

select option{
    background:white;
    color:black;
}

.filter-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#38bdf8;
    font-size:1.1rem;
}

.search-btn{
    padding:15px 30px;
    border:none;
    border-radius:20px;
    background:linear-gradient(45deg,#38bdf8,#3b82f6);
    color:white;
    font-size:1rem;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
    display:flex;
    align-items:center;
    gap:8px;
}

.search-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(56,189,248,0.4);
}

/* RESULTS INFO */
.results-info{
    margin-bottom:30px;
    font-size:1rem;
    opacity:0.9;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:25px;
    transition:all 0.4s ease;
    border:1px solid rgba(255,255,255,0.15);
    position:relative;
    overflow:hidden;
}

.card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:4px;
    background:linear-gradient(90deg,#38bdf8,#3b82f6);
    transform:scaleX(0);
    transition:transform 0.3s ease;
}

.card:hover::before{
    transform:scaleX(1);
}

.card:hover{
    transform:translateY(-15px);
    box-shadow:0 25px 50px rgba(0,0,0,0.3);
    background:rgba(255,255,255,0.18);
}

/* PROFILE */
.profile-img{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,0.3);
    margin-bottom:15px;
    transition:0.3s;
}

.card:hover .profile-img{
    border-color:#38bdf8;
    transform:scale(1.05);
}

/* CONTENT */
.card h3{
    font-size:1.3rem;
    margin-bottom:8px;
    font-weight:600;
}

.vehicle-tag{
    display:inline-block;
    padding:6px 15px;
    background:rgba(56,189,248,0.2);
    border-radius:20px;
    font-size:0.85rem;
    font-weight:500;
    margin-bottom:15px;
    border:1px solid rgba(56,189,248,0.3);
}

.details{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.detail-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:0.9rem;
    opacity:0.9;
}

.location-badge{
    background:rgba(34,197,94,0.2);
    color:#22c55e;
    padding:4px 12px;
    border-radius:15px;
    font-size:0.8rem;
    font-weight:500;
    margin-top:10px;
}

/* BUTTONS */
.btn-group{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
    font-size:0.9rem;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.btn-primary{
    background:linear-gradient(45deg,#38bdf8,#3b82f6);
    color:white;
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(56,189,248,0.4);
}

.btn-secondary{
    background:rgba(255,255,255,0.15);
    color:white;
    border:1px solid rgba(255,255,255,0.3);
}

.btn-secondary:hover{
    background:rgba(255,255,255,0.25);
}

/* RESPONSIVE */
@media (max-width:768px){
    .section{padding:80px 5%;}
    h1{font-size:2.5rem;}
    .filter-box{flex-direction:column;}
    select{min-width:100%;}
    .grid{grid-template-columns:1fr; gap:20px;}
    .details{justify-content:center;}
}

@media (max-width:480px){
    h1{font-size:2rem;}
    .filter-container{padding:20px 15px;}
}

.available-tag{
    position:absolute;
    top:10px;
    right:10px;
    background:#22c55e;
    color:white;
    padding:5px 10px;
    border-radius:15px;
    font-size:0.7rem;
    font-weight:500;
}



/* NAVBAR CONTAINER */
.navbar{
position: fixed;
top:0;
width:100%;
z-index:1000;

display:flex;
justify-content:space-between;
align-items:center;

padding:15px 8%;

background: rgba(15, 23, 42, 0.7);
backdrop-filter: blur(12px);

border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* LOGO */
.logo{
font-size:1.5rem;
font-weight:700;
letter-spacing:2px;
}

.logo span{
color:#38bdf8;
}

/* NAV MENU */
.nav-menu{
display:flex;
align-items:center;
gap:25px;
}

.nav-menu a{
text-decoration:none;
color:white;
font-size:0.9rem;
position:relative;
transition:0.3s;
}

/* UNDERLINE HOVER */
.nav-menu a::after{
content:"";
position:absolute;
left:0;
bottom:-5px;
width:0%;
height:2px;
background:#38bdf8;
transition:0.3s;
}

.nav-menu a:hover::after{
width:100%;
}

/* DROPDOWN */
.dropdown{
position:relative;
}

.dropdown-content{
position:absolute;
top:35px;
left:0;

background: rgba(15, 23, 42, 0.95);
backdrop-filter: blur(10px);

border-radius:10px;
padding:10px 0;

display:none;
flex-direction:column;
min-width:150px;
}

.dropdown-content a{
padding:10px 15px;
display:block;
}

.dropdown-content a:hover{
background: rgba(255,255,255,0.1);
}

/* SHOW DROPDOWN */
.dropdown:hover .dropdown-content{
display:flex;
}

/* RIGHT SIDE */
.nav-right{
display:flex;
align-items:center;
gap:15px;
}
/* LOGIN */
.nav-right a{
color:white;
text-decoration:none;
font-size:0.9rem;
}
/* SIGNUP BUTTON */
.btn-signup{
padding:8px 18px;
border-radius:20px;
background:#38bdf8;
color:white !important;
transition:0.3s;
}

.btn-signup:hover{
background:#0ea5e9;
transform:scale(1.05);
}
/* BODY FIX FOR FIXED NAVBAR */
body{
padding-top:80px;
}

/* MOBILE */
@media(max-width:768px){

.nav-menu{
display:none;
}

.navbar{
padding:15px 5%;
}

}





</style>
</head>

function showData(list){

    let container = document.getElementById("cards");
    let countEl = document.getElementById("count");

    container.innerHTML = "";
    countEl.textContent = list.length;

    // ✅ EMPTY STATE FIX
    if(list.length === 0){
        container.innerHTML = "<p style='margin-top:20px;'>No services found 😔</p>";
        return;
    }

    list.forEach(item => {

        let stars = "★".repeat(Math.floor(item.rating)) + "☆".repeat(5 - Math.floor(item.rating));

        container.innerHTML += `
            <div class="card">

            ${item.available ? '<span class="available-tag">Available Now</span>' : ''}

                <img src="${item.img}" class="profile-img">
                <h3>${item.name}</h3>

                <div class="vehicle-tag">${item.vehicle}</div>

                <div class="details">
                    <div class="detail-item">
                        <i class="fas fa-star"></i>
                        <span>${stars} ${item.rating}</span>
                    </div>

                    <div class="detail-item">
                        <i class="fas fa-phone"></i>
                      <span>
${localStorage.getItem("user") 
    ? item.phone 
    : item.phone.slice(0,6) + "****"}
</span>
                    </div>
                </div>

                <div class="location-badge">
                    <i class="fas fa-map-pin"></i> ${item.location.toUpperCase()}
                </div>

               <div class="btn-group">
    <button class="btn btn-primary" onclick="contact('${item.phone}')">
        <i class="fab fa-whatsapp"></i> WhatsApp
    </button>

    


  <button class="btn btn-secondary" onclick="viewMap('${item.map}')">
    <i class="fas fa-map"></i> Location
</button>

<button class="btn btn-select" onclick="
    ${item.type === 'guide' 
        ? `selectGuide('${item.email}')` 
        : `selectDriver('${item.email}')`}
">
    <i class="fas fa-map"></i> Select
</button>
</div>

            </div>
        `;
    });
}

function filterData(){
    let loc = document.getElementById("location").value;
    let type = document.getElementById("type").value;
    
    let filtered = data.filter(item => 
        (loc === "all" || item.location === loc) &&
        (type === "all" || item.type === type)
    );
    
    showData(filtered);
}

function contact(phone){
    window.open(`https://wa.me/${phone.replace(/^0/,'880')}`, '_blank');
}

function viewMap(mapUrl){
    alert("Opening map location...");
    window.open(mapUrl, '_blank');
}
